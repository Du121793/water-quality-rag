services:
  ai-pgvector:
    image: pgvector/pgvector:pg15
    container_name: fish-helper-ai-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AI_DATABASE_NAME:-ai_helper_db}
      POSTGRES_USER: ${AI_DATABASE_USER:-dev}
      POSTGRES_PASSWORD: ${AI_DATABASE_PASSWORD:-asdasd}
    ports:
      - "${AI_DATABASE_PORT:-5433}:5432"
    volumes:
      - ai_pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AI_DATABASE_USER:-dev} -d ${AI_DATABASE_NAME:-ai_helper_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: fish-helper-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ai_pgvector_data:
  redis_data:
